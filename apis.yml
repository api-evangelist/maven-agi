aid: maven-agi
url: https://raw.githubusercontent.com/api-evangelist/maven-agi/refs/heads/main/apis.yml
name: Maven AGI
kind: company
description: Maven AGI is an enterprise AI agent platform for customer experience.
  Its AI agents answer questions, take actions, and improve with every interaction
  across chat, email, voice, and SMS. The Maven Platform API lets developers build
  apps that manage conversations, knowledge, actions, users, events, and triggers,
  authenticated with an App ID and App Secret scoped to an organization and agent.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Agents
- Customer Support
- Customer Experience
- Conversational AI
- Knowledge
