    patch:
      tags: [Triggers]
      operationId: patchTrigger
      summary: Partially update a trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The updated trigger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trigger'
    delete:
      tags: [Triggers]
      operationId: deleteTrigger
      summary: Delete a trigger
      responses:
        '204':
          description: Trigger deleted.
  /app-settings:
    get:
      tags: [App Settings]
      operationId: getAppSettings
      summary: Get app settings
      responses:
        '200':
          description: The app settings.
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [App Settings]
      operationId: patchAppSettings
      summary: Patch app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The updated app settings.
          content:
            application/json:
              schema:
                type: object
  /app-settings/search:
    get:
      tags: [App Settings]
      operationId: searchAppSettings
      summary: Search app settings
      responses:
        '200':
          description: Matching app settings.
          content:
            application/json:
              schema:
                type: object
  /tables/conversations:
    post:
      tags: [Analytics]
      operationId: getConversationTable
      summary: Get conversation analytics table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The conversation table.
          content:
            application/json:
              schema:
                type: object
  /charts/conversations:
    post:
      tags: [Analytics]
      operationId: getConversationChart
      summary: Get conversation analytics chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The conversation chart.
          content:
            application/json:
              schema:
                type: object
  /tables/events:
    post:
      tags: [Analytics]
      operationId: getEventTable
      summary: Get event analytics table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The event table.
          content:
            application/json:
              schema:
                type: object
  /tables/feedback:
    post:
      tags: [Analytics]
      operationId: getFeedbackTable
      summary: Get feedback analytics table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The feedback table.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    appAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication using the App ID as the username and the App
        Secret as the password. Requests must also send X-Organization-Id and
        X-Agent-Id headers to scope the call to an organization and agent.
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    KnowledgeBaseReferenceId:
      name: knowledgeBaseReferenceId
      in: path
      required: true
      schema:
        type: string
    KnowledgeDocumentReferenceId:
      name: knowledgeDocumentReferenceId
      in: path
      required: true
      schema:
        type: string
    OrganizationReferenceId:
      name: organizationReferenceId
      in: path
      required: true
      schema:
        type: string
  schemas:
    EntityId:
      type: object
      description: A reference identifier scoped to a type.
      properties:
        referenceId:
          type: string
        type:
          type: string
        appId:
          type: string
    ConversationRequest:
      type: object
      properties:
        conversationId:
          $ref: '#/components/schemas/EntityId'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        subject:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    Conversation:
      type: object
      properties:
        conversationId:
          $ref: '#/components/schemas/EntityId'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        subject:
          type: string
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    ConversationMessage:
      type: object
      properties:
        conversationMessageId:
          $ref: '#/components/schemas/EntityId'
        userId:
          $ref: '#/components/schemas/EntityId'
        text:
          type: string
        responseLength:
          type: string
