          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
  /actions/search:
    post:
      tags: [Actions]
      operationId: searchActions
      summary: Search actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Matching actions.
          content:
            application/json:
              schema:
                type: object
  /actions/{actionReferenceId}:
    parameters:
    - name: actionReferenceId
      in: path
      required: true
      schema:
        type: string
    get:
      tags: [Actions]
      operationId: getAction
      summary: Get an action
      responses:
        '200':
          description: The requested action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
    patch:
      tags: [Actions]
      operationId: patchAction
      summary: Patch an action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The updated action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
    delete:
      tags: [Actions]
      operationId: deleteAction
      summary: Delete an action
      responses:
        '204':
          description: Action deleted.
  /users:
    put:
      tags: [Users]
      operationId: createOrUpdateUser
      summary: Create or update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: The created or updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
