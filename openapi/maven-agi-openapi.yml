      responses:
        '204':
          description: User deleted.
  /agentusers/search:
    post:
      tags: [Users]
      operationId: searchAgentUsers
      summary: Search agent users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Matching agent users.
          content:
            application/json:
              schema:
                type: object
  /agentusers/{agentUserId}:
    parameters:
    - name: agentUserId
      in: path
      required: true
      schema:
        type: string
    get:
      tags: [Users]
      operationId: getAgentUser
      summary: Get an agent user
      responses:
        '200':
          description: The requested agent user.
          content:
            application/json:
              schema:
                type: object
  /agents:
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The created agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
  /organizations/{organizationReferenceId}/agents:
    parameters:
    - $ref: '#/components/parameters/OrganizationReferenceId'
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents
      responses:
        '200':
          description: The list of agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
  /organizations/{organizationReferenceId}/agents/{agentReferenceId}:
    parameters:
    - $ref: '#/components/parameters/OrganizationReferenceId'
    - name: agentReferenceId
      in: path
      required: true
      schema:
        type: string
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent
      responses:
        '200':
          description: The requested agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    patch:
      tags: [Agents]
      operationId: patchAgent
      summary: Patch an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent
      responses:
        '204':
